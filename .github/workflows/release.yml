name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # OIDC(trusted publishing)로 발행하려면 npm 11.5.1+ 가 필요한데 setup-node 가
      # 얹어주는 건 Node 22 기본값(10.x)이다. 이 줄이 없으면 위의 id-token 권한이
      # 있어도 npm 이 OIDC 를 아예 시도하지 않고 토큰을 찾다가 죽는다.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

      # 발행은 **토큰 없이** OIDC 로 한다. npmjs.com 각 패키지의 Trusted Publisher 에
      # 이 repo 와 이 워크플로 파일이 등록돼 있어야 하고, 위 permissions 의
      # id-token: write 가 그 교환에 쓰인다.
      #
      # 왜 토큰을 안 쓰나: npm 이 2FA 우회 토큰을 걷어내고 있다(계정 변경 2026-08,
      # 직접 발행 2027-01). 지금 시크릿을 넣어도 만료 예정 경로다. 그리고 CI 에 둔
      # 장수 토큰은 유출되면 우리 스코프 전체를 발행할 수 있다 — OIDC 는 실행 건마다
      # 짧게 발급돼 그 반경이 없다.
      #
      # ⚠️ 이 repo 에는 NPM_TOKEN 시크릿이 **없다**(2026-08-06 확인). v0.3.0 태그가
      # build·lint·test·audit 를 전부 통과하고 이 단계에서만 ENEEDAUTH 로 죽었다 —
      # 로그를 안 열면 "태그 밀었으니 발행됐겠지"로 오독한다. Trusted Publisher 등록
      # 전까지는 로컬 `npm publish --workspaces --access public` 이 유일한 경로다.
      - run: npm publish --workspaces --access public
      - run: mkdir -p dist && (cd bundles/claude-desktop && zip -r ../../dist/schift-ai-memory.mcpb manifest.json)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/schift-ai-memory.mcpb
